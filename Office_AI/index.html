<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Analytics Dashboard</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Dashboard Styling -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">✨</span>
                    <h2>Office AI</h2>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">
                    <span class="nav-icon">📊</span>
                    Dashboard
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="pulse"></span>
                    Online
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div>
                    <h1>Analytics Results</h1>
                    <p class="subtitle">Real-time insights generated by Gemini AI</p>
                </div>
                <button class="action-button primary" id="refresh-btn">
                    <span>🔄 Refresh Data</span>
                </button>
            </header>

            <div class="search-container glass-panel">
                <form id="query-form" class="query-form">
                    <input type="text" id="query-input" placeholder="Ask a question about your data in plain English..."
                        required autocomplete="off">
                    <button type="submit" class="action-button primary">
                        <span>✨ Ask</span>
                    </button>
                </form>
            </div>

            <div class="dashboard-grid" id="results-grid">
                <!-- Data cards will be injected here by app.js -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading insights...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>

</html>
